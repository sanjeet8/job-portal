apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: sanjeet
            - name: POSTGRES_PASSWORD
              value: sanjeet123
            - name: POSTGRES_DB
              value: auth_db
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          emptyDir: {}  # For local testing (ephemeral storage)
